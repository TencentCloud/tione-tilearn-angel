# model
model_name_or_path: ../../models/baichuan-inc/Baichuan2-13B-Chat
#model_name_or_path: /mnt/cfs/tilearn/pretrain_models/Llama-2-7b-hf/

# method
stage: sft
do_train: true
finetuning_type: full

# ddp
ddp_timeout: 180000000
#deepspeed: ds_z3_config.json
deepspeed: ../../utils/ds_config/ds_z3_offload_config.json

# dataset
dataset: advertise_gen_train
dataset_dir: ../../data
template: baichuan2
cutoff_len: 2048
packing: true 
max_length: 2048
max_samples: 30000
overwrite_cache: true
preprocessing_num_workers: 16
disable_gradient_checkpointing: false

# output
output_dir: ../../ckpt/full/sft_baseline
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

# train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0001
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: auto

## eval
#val_size: 0.1
#per_device_eval_batch_size: 1
#evaluation_strategy: steps
#eval_steps: 500
