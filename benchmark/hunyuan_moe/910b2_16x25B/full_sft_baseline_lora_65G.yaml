# model
model_name_or_path: ../../models/Hunyuan_A52_16x25B
#model_name_or_path: ../../models/Qwen2.5-14B/

# method
stage: sft
do_train: true
#finetuning_type: full
finetuning_type: lora
lora_target: all

# ddp
ddp_timeout: 180000000
#deepspeed: ds_z3_config.json
deepspeed: ../../utils/ds_config/ds_z3_offload_config.json

# dataset
dataset: alpaca_en
dataset_dir: ../../data
template: qwen
cutoff_len: 1024
packing: true 
max_length: 1024
max_samples: 5000
overwrite_cache: true
preprocessing_num_workers: 16
disable_gradient_checkpointing: false

# output
output_dir: ../../ckpt/lora/sft_baseline
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

# train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.00001
num_train_epochs: 3.0
max_steps: 10
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
flash_attn: fa2

## eval
#val_size: 0.1
#per_device_eval_batch_size: 1
#evaluation_strategy: steps
#eval_steps: 500
